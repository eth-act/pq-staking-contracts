# Compiler settings are pinned so released bytecode is reproducible.
# Changing any of them changes the published bytecode.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Strip the CBOR metadata trailer: bytecode then depends only on the code and
# compiler settings, not on comments, file paths, or source formatting.
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 100
